<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}叶えたいことリスト{% endblock %}</title>
    <style>
        body {
            margin: 0;
            color: #242424;
            background: #f7f4ef;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        header {
            background: #ffffff;
            border-bottom: 1px solid #e5ded2;
            padding: 18px 24px;
        }
        header h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }
        .site-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .mobile-menu {
            display: contents;
        }
        .mobile-menu summary {
            display: none;
        }
        .mobile-menu-content {
            display: contents;
        }
        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        nav a, .button, .user-menu summary {
            display: inline-block;
            border: 1px solid #bca98f;
            border-radius: 6px;
            padding: 8px 12px;
            color: #3d3327;
            background: #ffffff;
            text-decoration: none;
            cursor: pointer;
            font: inherit;
        }
        nav form {
            margin: 0;
        }
        nav a:hover, .button:hover, .user-menu summary:hover {
            background: #efe7da;
        }
        .user-menu {
            position: relative;
        }
        .user-menu summary {
            list-style: none;
        }
        .user-menu summary::-webkit-details-marker {
            display: none;
        }
        .user-menu-panel {
            position: absolute;
            right: 0;
            z-index: 10;
            display: grid;
            gap: 6px;
            min-width: 150px;
            margin-top: 6px;
            padding: 8px;
            border: 1px solid #e3d9cb;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        .user-menu-panel a,
        .user-menu-panel .button {
            box-sizing: border-box;
            width: 100%;
            text-align: left;
        }
        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 22px 18px 48px;
        }
        .page-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }
        .page-title h2 {
            margin: 0;
            font-size: 26px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }
        .panel, .item, form.form-box {
            border: 1px solid #e3d9cb;
            border-radius: 8px;
            background: #ffffff;
            padding: 18px;
        }
        .panel h3 {
            margin-top: 0;
        }
        .item {
            margin-bottom: 12px;
        }
        .item.done {
            opacity: 0.62;
        }
        .item.done .item-title {
            text-decoration: line-through;
        }
        .item-title {
            font-weight: 700;
        }
        .check-item {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 10px;
            align-items: start;
        }
        .check-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: #6f5634;
            cursor: pointer;
        }
        .check-form {
            margin: 0;
        }
        .date-pill {
            display: inline-block;
            border-radius: 999px;
            background: #f1eadf;
            color: #5a4c3d;
            padding: 3px 9px;
            font-size: 13px;
            margin-left: 8px;
        }
        .meta {
            color: #71675c;
            font-size: 14px;
            margin-top: 6px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .danger {
            border-color: #c68686;
            color: #842f2f;
        }
        .small-button {
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 13px;
            line-height: 1.3;
        }
        .compact-action-button,
        .want-button,
        .together-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 96px;
            white-space: nowrap;
            text-align: center;
        }
        .public-goal-actions {
            display: inline-flex;
            flex-wrap: nowrap;
            gap: 6px;
            align-items: center;
            justify-content: flex-end;
        }
        .public-goal-actions form {
            flex: 0 0 auto;
            margin: 0;
        }
        .public-goal-row {
            grid-template-columns: 20px minmax(0, 1fr) max-content;
        }
        .disabled-button,
        .disabled-button:hover,
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #eeeeee;
        }
        .compact-settings {
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .compact-settings form p {
            display: inline-block;
            margin: 0 10px 8px 0;
        }
        .compact-settings label {
            display: inline;
            margin: 0 6px 0 0;
        }
        .compact-settings input,
        .compact-settings select {
            width: auto;
            min-width: 90px;
            padding: 5px 8px;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin: 0 0 12px;
        }
        .filter-bar label {
            margin: 0;
            font-weight: 700;
        }
        .filter-bar select {
            width: auto;
            min-width: 130px;
            padding: 5px 8px;
        }
        .checklist {
            border: 1px solid #e3d9cb;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }
        .list-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            min-height: 34px;
            padding: 6px 8px;
            border-bottom: 1px solid #eee8de;
        }
        .list-row:last-child {
            border-bottom: 0;
        }
        .list-row.done {
            color: #777;
            background: #faf8f4;
        }
        .list-row.done .row-title {
            text-decoration: line-through;
        }
        .row-check-form {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            min-width: 0;
            margin: 0;
        }
        .row-check-form input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #6f5634;
            cursor: pointer;
        }
        .row-main {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            min-width: 0;
        }
        .row-title {
            min-width: 0;
            overflow-wrap: anywhere;
            font-weight: 600;
        }
        .completed-date {
            color: #71675c;
            font-size: 13px;
            white-space: nowrap;
        }
        .meta-badge,
        .status-pill {
            display: inline-block;
            border-radius: 999px;
            background: #f1eadf;
            color: #5a4c3d;
            padding: 2px 7px;
            font-size: 12px;
            white-space: nowrap;
        }
        .meta-badge.private,
        .status-pill.private {
            background: #eeeeee;
            color: #666666;
        }
        .progress-summary {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
            border: 1px solid #e4d7c4;
            border-radius: 18px;
            background: #fffdf8;
            padding: 16px;
            box-shadow: 0 8px 18px rgba(76, 57, 33, 0.06);
        }
        .progress-summary p {
            margin: 0;
        }
        .progress-summary-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .progress-track,
        .app-progress-track {
            width: 100%;
            height: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: #eee6da;
        }
        .progress-bar,
        .app-progress-bar {
            height: 100%;
            border-radius: inherit;
            background: #8c6f48;
        }
        .app-checkbox {
            display: inline-grid;
            place-items: center;
            width: 18px;
            height: 18px;
            min-width: 18px;
            min-height: 18px;
            box-sizing: border-box;
            border: 1.8px solid #6f5634;
            border-radius: 3px;
            background: #fffdf8;
            color: #6f5634;
            font-size: 14px;
            font-weight: 800;
            line-height: 1;
            vertical-align: middle;
            appearance: none;
            -webkit-appearance: none;
        }
        input.app-checkbox {
            cursor: pointer;
        }
        input.app-checkbox:checked::after,
        .app-checkbox.is-checked::after {
            content: "✓";
            transform: translateY(-1px);
        }
        .app-checkbox:focus-visible {
            outline: 2px solid rgba(111, 86, 52, 0.28);
            outline-offset: 2px;
        }
        .app-checkbox.is-readonly {
            cursor: default;
        }
        .list-card {
            position: relative;
            display: grid;
            gap: 10px;
            border: 1px solid #eadfce;
            border-radius: 14px;
            background: #fffdf8;
            padding: 16px;
            box-shadow: 0 8px 18px rgba(76, 57, 33, 0.06);
        }
        .list-card-title {
            margin: 0;
            color: #3d3021;
            font-size: 18px;
            line-height: 1.45;
        }
        .list-card-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: start;
        }
        .visibility-badge {
            justify-self: end;
            border-radius: 999px;
            background: #f1eadf;
            color: #5a4c3d;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .visibility-badge.private {
            background: #eeeeee;
            color: #666666;
        }
        .meta-text {
            margin: 0;
            color: #6a5841;
            font-size: 13px;
            font-weight: 700;
        }
        .discover-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }
        .discover-card-head {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }
        .discover-card h3 {
            margin: 2px 0 0;
            color: #3e3326;
            font-size: 18px;
            line-height: 1.45;
        }
        .discover-title-link {
            color: inherit;
            text-decoration: none;
            text-underline-offset: 4px;
            text-decoration-thickness: 1px;
        }
        .discover-title-link:hover,
        .discover-title-link:focus,
        .discover-title-link:active {
            color: #6f5634;
            text-decoration: underline;
        }
        .profile-avatar-link {
            color: inherit;
            text-decoration: none;
        }
        .discover-user {
            margin: 0;
            color: #7a6750;
            font-size: 13px;
            font-weight: 700;
        }
        .discover-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .discover-actions {
            justify-content: flex-end;
        }
        .discover-actions form {
            margin: 0;
        }
        .discover-progress {
            display: grid;
            gap: 6px;
            color: #6a5841;
            font-size: 13px;
            font-weight: 700;
        }
        .discover-progress-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .discover-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0;
            color: #8a7a67;
            font-size: 12px;
        }
        .discover-stats div {
            display: inline-flex;
            gap: 4px;
            align-items: baseline;
            border: 1px solid #eadfce;
            border-radius: 999px;
            background: rgba(255, 253, 248, 0.82);
            padding: 3px 8px;
        }
        .discover-stats dt {
            color: #8a7a67;
            font-size: 12px;
        }
        .discover-stats dd {
            margin: 0;
            color: #6a5841;
            font-weight: 600;
        }
        .menu-popover {
            position: relative;
        }
        .menu-popover summary {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border: 1px solid #d8c9b5;
            border-radius: 50%;
            background: #fffdf8;
            color: #4d3d2b;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            list-style: none;
        }
        .menu-popover summary::-webkit-details-marker {
            display: none;
        }
        .menu-popover-panel {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 20;
            display: grid;
            min-width: 170px;
            overflow: hidden;
            border: 1px solid #eadfce;
            border-radius: 14px;
            background: #fffdf8;
            box-shadow: 0 12px 28px rgba(76, 57, 33, 0.14);
        }
        .menu-popover-link {
            padding: 12px 14px;
            border-bottom: 1px solid #f0e8dc;
            color: #3d3021;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        .menu-popover-link:last-child {
            border-bottom: 0;
        }
        .menu-popover-link:hover,
        .menu-popover-link:focus {
            background: #fff8ec;
        }
        .clear-search-link {
            color: #7a6750;
            font-size: 12px;
            text-decoration: none;
            text-underline-offset: 3px;
        }
        .clear-search-link:hover,
        .clear-search-link:focus,
        .clear-search-link:active {
            text-decoration: underline;
        }
        .segment-tabs {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            padding: 2px;
        }
        .segment-tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            border: 1px solid #e0d2be;
            border-radius: 999px;
            background: #fffdf8;
            color: #6a5841;
            padding: 7px 13px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }
        .segment-tab:hover,
        .segment-tab:focus,
        .segment-tab:active {
            text-decoration: none;
            background: #fff8ec;
        }
        .segment-tab.is-active {
            border-color: #8b6f4a;
            background: #6f5634;
            color: #fffdf8;
        }
        .list-item-row {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            min-height: 32px;
            padding: 7px 10px;
            border-bottom: 1px solid #f0e8dc;
            overflow: hidden;
        }
        .checklist .list-item-row {
            padding-left: 12px;
            padding-right: 12px;
        }
        .list-item-row .row-main,
        .list-item-row .notebook-goal-main,
        .list-item-row .public-goal-main {
            min-width: 0;
        }
        .list-item-row .row-title,
        .list-item-row .notebook-goal-title,
        .list-item-row .public-goal-title {
            min-width: 0;
            overflow-wrap: anywhere;
        }
        .app-pagination,
        .pagination {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
        }
        .app-pagination .button,
        .pagination .button {
            width: auto;
            flex: 0 0 auto;
            min-width: 58px;
            padding-left: 12px;
            padding-right: 12px;
            white-space: nowrap;
        }
        .app-pagination span,
        .pagination span {
            color: #5e5143;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }
        .back-link,
        .app-back-link {
            color: #6a5538;
            font-weight: 700;
            text-decoration: none;
            text-underline-offset: 4px;
        }
        .back-link:hover,
        .back-link:focus,
        .back-link:active,
        .app-back-link:hover,
        .app-back-link:focus,
        .app-back-link:active {
            text-decoration: underline;
        }
        .item-detail-header {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }
        .item-detail-title-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            align-items: start;
        }
        .item-detail-title-main {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }
        .item-detail-title-main h2 {
            margin: 0;
            color: #3d3021;
            font-size: 26px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }
        .item-detail-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }
        .item-detail-actions .button {
            white-space: nowrap;
        }
        .item-detail-card {
            display: grid;
            gap: 0;
            border: 1px solid #eadfce;
            border-radius: 16px;
            background: #fffdf8;
            padding: 16px;
            box-shadow: 0 8px 18px rgba(76, 57, 33, 0.06);
        }
        .item-detail-section {
            display: grid;
            gap: 6px;
            padding: 11px 0;
            border-bottom: 1px solid #f0e8dc;
        }
        .item-detail-section:last-child {
            border-bottom: 0;
        }
        .item-detail-label {
            color: #7a6750;
            font-size: 13px;
            font-weight: 800;
        }
        .item-detail-body {
            margin: 0;
            color: #3d3021;
            line-height: 1.75;
        }
        .item-detail-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
        }
        .item-detail-owner {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }
        .item-detail-owner-text {
            display: grid;
            gap: 3px;
        }
        .app-form-card {
            display: grid;
            gap: 18px;
            border: 1px solid #e3d9cb;
            border-radius: 18px;
            background: #fffdf8;
            padding: 18px;
            box-shadow: 0 8px 18px rgba(76, 57, 33, 0.06);
        }
        .app-field {
            display: grid;
            gap: 7px;
            min-width: 0;
        }
        .app-label {
            margin: 0;
            color: #5f4d38;
            font-size: 13px;
            font-weight: 700;
        }
        .app-input,
        .app-textarea,
        .app-select {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            border: 1px solid #cfc4b5;
            border-radius: 12px;
            background: #ffffff;
            padding: 10px 12px;
            color: #242424;
            font: inherit;
        }
        .app-textarea {
            min-height: 120px;
            max-height: 160px;
            resize: vertical;
            line-height: 1.6;
        }
        .app-file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }
        .app-file-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #bca98f;
            border-radius: 999px;
            background: #ffffff;
            color: #3d3327;
            padding: 7px 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .app-file-button:hover,
        .app-file-button:focus {
            background: #efe7da;
        }
        .app-text-link {
            display: inline;
            border: 0;
            background: transparent;
            color: #7a6750;
            padding: 0;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            text-underline-offset: 3px;
            cursor: pointer;
        }
        .app-text-link:hover,
        .app-text-link:focus,
        .app-text-link:active {
            text-decoration: underline;
            background: transparent;
        }
        .reaction-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .reaction-actions form {
            margin: 0;
        }
        .reaction-pair {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }
        .app-error {
            color: #842f2f;
            font-size: 13px;
            margin: 0;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .stat-box {
            border: 1px solid #eadfce;
            border-radius: 8px;
            background: #fffdf8;
            padding: 10px;
        }
        .stat-box strong {
            display: block;
            font-size: 18px;
        }
        .avatar {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            background: #efe7da;
            color: #5a4c3d;
            font-weight: 700;
            vertical-align: middle;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar.large {
            width: 84px;
            height: 84px;
            font-size: 30px;
        }
        .confetti-message {
            position: relative;
            overflow: hidden;
        }
        .confetti-message::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 25%, #f5a623 0 3px, transparent 4px),
                radial-gradient(circle at 45% 18%, #7bbf6a 0 3px, transparent 4px),
                radial-gradient(circle at 72% 32%, #d86f8c 0 3px, transparent 4px),
                radial-gradient(circle at 88% 60%, #5aa7d6 0 3px, transparent 4px);
            animation: confetti-fade 1.4s ease-out;
        }
        @keyframes confetti-fade {
            from { opacity: 1; transform: translateY(-8px); }
            to { opacity: 0; transform: translateY(18px); }
        }
        .completion-editor {
            display: none;
