{% extends "goals/base.html" %}

{% block title %}作成 - Wishly{% endblock %}

{% block content %}
<style>
    .create-hub-page,
    .create-hub-page * {
        box-sizing: border-box;
    }
    .create-hub-page {
        width: min(100%, 560px);
        min-height: calc(100dvh - 40px);
        display: grid;
        align-content: start;
        justify-items: stretch;
        gap: 34px;
        margin-inline: auto;
        padding: 8px 16px calc(128px + env(safe-area-inset-bottom));
    }
    .create-close-row { display: flex; justify-content: flex-end; width: 100%; box-sizing: border-box; }
    .create-close-link { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; color: var(--app-text, #37352f); text-decoration: none; }
    .create-close-link svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .create-hub-page > section { width: 100%; max-width: 100%; margin-inline: auto; }
    .create-hub-title {
        width: 100%;
        max-width: 100%;
        margin: 18px auto 16px !important;
        color: var(--app-text, #37352f);
        font-size: clamp(21px, 5.35vw, 26px) !important;
        font-weight: 720 !important;
        line-height: 1.3 !important;
        text-align: center;
        letter-spacing: 0 !important;
        white-space: nowrap;
    }
    .create-option-list { display: grid; gap: 14px; width: 100%; box-sizing: border-box; margin-inline: auto; }
    .create-option-card { width: 100%; box-sizing: border-box; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; min-height: 124px; border: 1px solid var(--app-border, #e5e5e5); border-radius: 24px; background: #fff; padding: 22px; color: inherit; text-decoration: none; box-shadow: 0 6px 24px rgba(15, 15, 15, 0.04); }
    .create-option-card:hover, .create-option-card:focus { border-color: #d6d6d6; text-decoration: none; transform: translateY(-1px); }
    .create-option-icon { display: inline-flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 50%; background: var(--app-subtle-bg, #f7f7f5); color: var(--app-text, #37352f); border: 1px solid var(--app-border, #e5e5e5); }
    .create-option-icon svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .create-option-card h3 { margin: 0 0 8px; color: var(--app-text, #37352f); font-size: 18px; line-height: 1.35; letter-spacing: 0; }
    .create-option-card p { margin: 0; color: var(--app-muted, #787774); font-size: 14px; line-height: 1.55; }
    @media (max-width: 760px) {
        .create-hub-page { width: 100%; max-width: 100%; gap: 28px; padding: 4px 14px calc(128px + env(safe-area-inset-bottom)); }
        .create-hub-title { font-size: clamp(20px, 5.35vw, 24px) !important; }
        .create-option-card { min-height: 112px; border-radius: 22px; padding: 18px; gap: 16px; }
        .create-option-icon { width: 68px; height: 68px; }
        .create-option-icon svg { width: 31px; height: 31px; }
    }
    @media (max-width: 390px) {
        .create-hub-page { padding-inline: 12px; }
        .create-hub-title { font-size: clamp(20px, 5.25vw, 21px) !important; }
        .create-option-card { grid-template-columns: auto minmax(0, 1fr); padding: 16px; gap: 14px; }
        .create-option-icon { width: 62px; height: 62px; }
    }
</style>

<div class="create-hub-page">
    <div class="create-close-row">
        <a class="create-close-link" href="{% url 'goals:yearly_goal_list' %}" aria-label="閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
        </a>
    </div>

    <section aria-label="作成方法">
        <h2 class="create-hub-title">どのようにリストを作成しますか？</h2>
        <div class="create-option-list">
            <a class="create-option-card" href="{% url 'goals:my_list_add' %}">
                <span class="create-option-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
                <span><h3>新しいリストを作成</h3><p>ゼロから自由に作成します</p></span>
            </a>
            <a class="create-option-card" href="{% url 'goals:my_list_add' %}?collaborative=1">
                <span class="create-option-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0-2.8-4"></path><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path><path d="M3.5 20a5.5 5.5 0 0 1 9 0"></path><path d="M13.5 16.5a5 5 0 0 1 7 3.5"></path></svg></span>
                <span><h3>共同リストを作成</h3><p>家族や友達と一緒に作成します</p></span>
            </a>
            <a class="create-option-card" href="{% url 'goals:template_list' %}">
                <span class="create-option-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1.5-1.5Z"></path><path d="M14 3.5v5h5"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg></span>
                <span><h3>テンプレートから作成</h3><p>人気のテンプレートを使います</p></span>
            </a>
        </div>
    </section>
</div>
{% endblock %}
