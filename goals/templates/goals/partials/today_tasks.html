{% for task in tasks %}
    <article class="item {% if task.is_done %}done{% endif %}">
        <div class="item-title">{{ task.title }}</div>
        <p class="meta">{{ task.scheduled_date|date:"Y年n月j日" }}</p>
        <div class="actions">
            <form method="post" action="{% url 'goals:toggle_done' 'today' task.pk %}">
                {% csrf_token %}
                <button class="button" type="submit">
                    {% if task.is_done %}未完了に戻す{% else %}完了にする{% endif %}
                </button>
            </form>
            {% if show_actions %}
                <a class="button" href="{% url 'goals:today_task_edit' task.pk %}">編集</a>
                <a class="button danger" href="{% url 'goals:today_task_delete' task.pk %}">削除</a>
            {% endif %}
        </div>
    </article>
{% empty %}
    <p class="notice">今日TODOはまだありません。</p>
{% endfor %}
